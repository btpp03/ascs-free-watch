name: ascs-probe2

on:
  workflow_dispatch:
  schedule:
    # 每 5 分钟（GitHub 原生 schedule 常丢 tick，主腿是 cron-job.org 外部 dispatch）
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: ascs-probe2
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 盯二号订单状态
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          ASCS2_EMAIL: ${{ secrets.ASCS2_EMAIL }}
          ASCS2_PASSWORD: ${{ secrets.ASCS2_PASSWORD }}
          ASCS2_ORDER: ORD-1795670706982
        run: python3 probe2.py

      - name: 保存状态
        run: |
          git config user.name "ascs-probe2"
          git config user.email "actions@users.noreply.github.com"
          git add state2.json
          if git diff --cached --quiet; then
            echo "状态无变化，不提交"
          else
            git commit -m "state2: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
